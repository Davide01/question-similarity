[project]
name = "question-sim"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4"
dependencies = [
    "jupyter (>=1.1.1,<2.0.0)",
    "pandas (<3.0.0)",
    "torch (>=2.10.0,<3.0.0) ; python_version >= \"3.10\" and python_version < \"3.15\"",
    "sentence-transformers[openvino] (>=5.3.0,<6.0.0) ; python_version >= \"3.10\" and python_version < \"3.15\"",
    "datasets (>=4.7.0,<5.0.0)",
    "accelerate (>=1.13.0,<2.0.0) ; python_version >= \"3.10\" and python_version < \"3.15\"",
    "mlflow (>=3.10.1,<4.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "graphql-core (>=3.0) ; python_version >= \"3.14\" and python_version < \"4\"",
    "graphene (>=3.0)",
    "fastapi (>=0.135.1,<0.136.0)",
    "uvicorn[standard] (>=0.34.0,<0.35.0)",
    "pre-commit (>=4.5.1,<5.0.0)",
    "ruff (>=0.15.7,<0.16.0)"
]

[tool.poetry]
packages = [{include = "question_sim", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
